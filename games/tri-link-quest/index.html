<body>
<a class="skip" href="#game">Sari la joc</a>
<main class="app" id="game" data-mini-game-id="tri-link-quest">
  <header class="top"><div class="brand"><h1>🧩 Tri-Link Quest</h1><p data-t="tag">Puzzle · Match · Connect — trei lumi, o singură misiune</p></div><div class="tools"><button class="btn" id="difficulty">NORMAL</button><button class="icon" id="contrast" aria-label="Contrast ridicat">◐</button><button class="icon" id="sound" aria-label="Sunet pornit">🔊</button><button class="icon" id="theme" aria-label="Schimbă tema">☀️</button><button class="btn" id="lang" aria-label="Change language">EN</button></div></header>
  <section class="hud" aria-label="Progres"><div class="stat"><b id="score">0</b><span data-t="score">SCOR</span></div><div class="stat"><b id="xp">0</b><span>XP</span></div><div class="stat"><b id="streak">0×</b><span>STREAK</span></div><div class="stat"><b id="best">0</b><span data-t="best">RECORD</span></div></section>
  <nav class="tabs" aria-label="Etape"><button class="btn tab" data-stage="0" aria-selected="true">1 · PUZZLE</button><button class="btn tab" data-stage="1" aria-selected="false" disabled>2 · MATCH</button><button class="btn tab" data-stage="2" aria-selected="false" disabled>3 · CONNECT</button></nav>

</main><div class="toast" id="toast" role="status"></div><div class="confetti" id="confetti" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)];
const I={ro:{tag:'Puzzle · Match · Connect — trei lumi, o singură misiune',score:'SCOR',best:'RECORD',moves:'mutări',reset:'Reîncepe',hint:'Indiciu',next:'Etapa următoare',pTitle:'Puzzle glisant',pDesc:'Ordonează piesele de la 1 la 8. Atinge o piesă vecină cu spațiul liber.',mTitle:'Match-3',mDesc:'Schimbă două simboluri vecine și formează linii de cel puțin 3.',goal:'Țintă',cTitle:'Conectează perechile',cDesc:'Unește simbolurile identice. Traseele nu se pot suprapune.',clear:'Șterge traseele',win:'Etapă finalizată!',all:'Misiune completă!',locked:'Finalizează etapa anterioară.',saved:'Progres salvat',soundOn:'Sunet pornit',soundOff:'Sunet oprit',helpP:'Tastatură: săgeți pentru mutarea spațiului.',helpM:'Selectează două celule vecine. Potrivește 3 sau mai multe.',helpC:'Selectează primul capăt, celulele traseului, apoi perechea lui.'},en:{tag:'Puzzle · Match · Connect — three worlds, one mission',score:'SCORE',best:'BEST',moves:'moves',reset:'Restart',hint:'Hint',next:'Next stage',pTitle:'Sliding puzzle',pDesc:'Order the tiles from 1 to 8. Tap a tile next to the empty space.',mTitle:'Match-3',mDesc:'Swap two neighboring symbols and create lines of at least 3.',goal:'Goal',cTitle:'Connect the pairs',cDesc:'Join matching symbols. Paths cannot overlap.',clear:'Clear paths',win:'Stage complete!',all:'Mission complete!',locked:'Complete the previous stage.',saved:'Progress saved',soundOn:'Sound on',soundOff:'Sound off',helpP:'Keyboard: use arrow keys to move the empty space.',helpM:'Select two adjacent cells. Match 3 or more.',helpC:'Select the first endpoint, path cells, then its pair.'}};
const KEY='triLinkQuest.v1', saved=JSON.parse(localStorage.getItem(KEY)||'{}');
let S={lang:saved.lang||'ro',theme:saved.theme||'dark',contrast:!!saved.contrast,difficulty:saved.difficulty||'normal',campaign:saved.campaign||1,sound:saved.sound!==false,score:saved.score||0,xp:saved.xp||0,best:saved.best||0,streak:saved.streak||0,unlocked:saved.unlocked||0,stage:Math.min(saved.stage||0,saved.unlocked||0),done:saved.done||[false,false,false],moves:0};
let puzzle=[], gems=[], selected=null, matchGoal=0, paths={}, drawing=null;
const t=k=>I[S.lang][k]||k, persist=()=>localStorage.setItem(KEY,JSON.stringify(S));
function announce(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(announce.x);announce.x=setTimeout(()=>$('#toast').classList.remove('show'),1700)}
function beep(n=1){if(!S.sound)return;const A=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=A.createOscillator(),g=A.createGain();o.frequency.value=430+i*130;g.gain.setValueAtTime(.06,A.currentTime+i*.08);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+i*.08+.13);o.connect(g).connect(A.destination);o.start(A.currentTime+i*.08);o.stop(A.currentTime+i*.08+.14)}}
function hud(){$('#score').textContent=S.score;$('#xp').textContent=S.xp;$('#streak').textContent=S.streak+'×';$('#best').textContent=`${S.campaign}/10 · ${S.best}`;$$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.documentElement.lang=S.lang;document.documentElement.dataset.theme=S.theme;document.body.style.filter=S.contrast?'contrast(1.25) saturate(1.15)':'';$('#difficulty').textContent=S.difficulty.toUpperCase();$('#lang').textContent=S.lang==='ro'?'EN':'RO';$('#theme').textContent=S.theme==='dark'?'☀️':'🌙';$('#sound').textContent=S.sound?'🔊':'🔇';$('#sound').ariaLabel=t(S.sound?'soundOn':'soundOff');$$('.tab').forEach((b,i)=>{b.disabled=i>S.unlocked;b.setAttribute('aria-selected',i===S.stage)})}
function render(){hud();S.moves=0;selected=null; if(S.stage===0)renderPuzzle();if(S.stage===1)renderMatch();if(S.stage===2)renderConnect();persist()}
function shell(title,desc,meta,body,actions,help){$('#screen').innerHTML=`<div class="stagehead"><div><h2>${title}</h2><p>${desc}</p></div><span class="pill">${meta}</span></div>${body}<p class="status" id="status"></p><div class="actions">${actions}</div><div class="help">♿ ${help}</div>`}
function shufflePuzzle(){do{puzzle=[1,2,3,4,5,6,7,8,0].sort(()=>Math.random()-.5)}while(!solvable(puzzle)||puzzle.every((v,i)=>v===[1,2,3,4,5,6,7,8,0][i]))}
function solvable(a){let inv=0,b=a.filter(Boolean);for(let i=0;i<b.length;i++)for(let j=i+1;j<b.length;j++)if(b[i]>b[j])inv++;return inv%2===0}
function renderPuzzle(){if(!puzzle.length)shufflePuzzle();shell(t('pTitle'),t('pDesc'),`${S.moves} ${t('moves')}`,`<div class="board puzzle" role="grid" aria-label="Sliding puzzle">${puzzle.map((v,i)=>`<button class="tile ${v?'':'empty'}" data-i="${i}" ${v?'':'disabled'} aria-label="${v||'empty'}">${v||''}</button>`).join('')}</div>`,`<button class="btn" id="reset">↻ ${t('reset')}</button><button class="btn" id="hint">💡 ${t('hint')}</button>`,t('helpP'));$$('.tile').forEach(b=>b.onclick=()=>movePuzzle(+b.dataset.i));$('#reset').onclick=()=>{shufflePuzzle();renderPuzzle()};$('#hint').onclick=()=>{let z=puzzle.indexOf(0),a=[z-1,z+1,z-3,z+3].filter(i=>i>=0&&i<9&&Math.abs(i%3-z%3)+Math.abs((i/3|0)-(z/3|0))===1);$(`[data-i="${a[0]}"]`).focus();announce(t('hint'))}}
function movePuzzle(i){let z=puzzle.indexOf(0);if(Math.abs(i%3-z%3)+Math.abs((i/3|0)-(z/3|0))!==1)return;[puzzle[i],puzzle[z]]=[puzzle[z],puzzle[i]];S.moves++;beep();if(puzzle.every((v,j)=>v===[1,2,3,4,5,6,7,8,0][j]))complete(0);else renderPuzzle()}
const EM=['🔷','💜','⭐','🍒','🌿'];
function freshGems(){gems=Array.from({length:36},(_,i)=>{let options=[...EM],r=i/6|0,c=i%6;if(c>1&&gems[i-1]===gems[i-2])options=options.filter(x=>x!==gems[i-1]);if(r>1&&gems[i-6]===gems[i-12])options=options.filter(x=>x!==gems[i-6]);return options[Math.random()*options.length|0]});matchGoal=0}
function renderMatch(){if(!gems.length)freshGems();const target={easy:9,normal:12,hard:18}[S.difficulty]+S.campaign-1;shell(t('mTitle'),t('mDesc'),`${t('goal')}: ${matchGoal}/${target}`,`<div class="board match" role="grid">${gems.map((v,i)=>`<button class="tile gem ${selected===i?'selected':''}" data-i="${i}" aria-label="${v}, ${i/6|0}+1, ${i%6+1}">${v}</button>`).join('')}</div>`,`<button class="btn" id="reset">↻ ${t('reset')}</button>`,t('helpM'));$$('.gem').forEach(b=>b.onclick=()=>pickGem(+b.dataset.i));$('#reset').onclick=()=>{freshGems();renderMatch()}}
function adjacent(a,b){return Math.abs(a%6-b%6)+Math.abs((a/6|0)-(b/6|0))===1}function matches(){let q=new Set;for(let r=0;r<6;r++)for(let c=0;c<4;c++){let i=r*6+c;if(gems[i]===gems[i+1]&&gems[i]===gems[i+2])[i,i+1,i+2].forEach(x=>q.add(x))}for(let c=0;c<6;c++)for(let r=0;r<4;r++){let i=r*6+c;if(gems[i]===gems[i+6]&&gems[i]===gems[i+12])[i,i+6,i+12].forEach(x=>q.add(x))}return q}
function pickGem(i){if(selected===null){selected=i;renderMatch();return}if(!adjacent(selected,i)){selected=i;renderMatch();return}let a=selected;selected=null;[gems[a],gems[i]]=[gems[i],gems[a]];let m=matches();if(!m.size){[gems[a],gems[i]]=[gems[i],gems[a]];S.streak=0;announce('↩');renderMatch();return}resolveMatches(m)}
function resolveMatches(m){matchGoal+=m.size;S.score+=m.size*15*(1+Math.min(S.streak,4));S.xp+=m.size*2;S.streak++;m.forEach(i=>gems[i]=null);for(let c=0;c<6;c++){let col=[];for(let r=5;r>=0;r--)if(gems[r*6+c])col.push(gems[r*6+c]);for(let r=5;r>=0;r--)gems[r*6+c]=col[5-r]||EM[Math.random()*EM.length|0]}beep(2);const target={easy:9,normal:12,hard:18}[S.difficulty]+S.campaign-1;if(matchGoal>=target)complete(1);else{let more=matches();more.size?setTimeout(()=>resolveMatches(more),180):renderMatch()}}
const END={0:{e:'🔴',p:'#ff5c75'},4:{e:'🔴',p:'#ff5c75'},6:{e:'🔵',p:'#4eb8ff'},18:{e:'🔵',p:'#4eb8ff'},20:{e:'🟢',p:'#55e89b'},24:{e:'🟢',p:'#55e89b'}};
function renderConnect(){shell(t('cTitle'),t('cDesc'),`${Object.keys(paths).length}/3`,`<div class="board connect" role="grid">${Array.from({length:25},(_,i)=>{let e=END[i],owner=Object.entries(paths).find(([,v])=>v.includes(i))?.[0],p=e?.p||(owner&&END[owner].p)||'#fff';return`<button class="tile cell ${e?'endpoint':''} ${owner?'path':''}" style="--path:${p}" data-i="${i}" aria-label="${e?.e||'cell'}"><i>${e?.e||''}</i></button>`}).join('')}</div>`,`<button class="btn" id="clear">⌫ ${t('clear')}</button>`,t('helpC'));$$('.cell').forEach(b=>b.onclick=()=>connectPick(+b.dataset.i));$('#clear').onclick=()=>{paths={};drawing=null;renderConnect()}}
function connectPick(i){if(END[i]&&!drawing){drawing={start:i,list:[i]};renderConnect();return}if(!drawing)return;let last=drawing.list.at(-1),occupied=Object.values(paths).flat().includes(i);if(occupied||Math.abs(last%5-i%5)+Math.abs((last/5|0)-(i/5|0))!==1){announce('⛔');return}drawing.list.push(i);if(END[i]){if(END[i].e===END[drawing.start].e&&i!==drawing.start){paths[drawing.start]=drawing.list;drawing=null;beep(2);if(Object.keys(paths).length===3)complete(2);else renderConnect()}else{drawing=null;announce('⛔');renderConnect()}}else renderConnect()}
function complete(stage){if(S.done[stage])return;S.done[stage]=true;S.score+=Math.max(50,300-stage*S.moves*2);S.xp+=100;S.streak++;S.best=Math.max(S.best,S.score);if(stage<2)S.unlocked=Math.max(S.unlocked,stage+1);persist();confetti();beep(3);emit(stage);shell(stage===2?t('all'):t('win'),'⭐ +100 XP',`${S.score} ${t('score')}`,'<div style="font-size:5rem;text-align:center;margin:45px">🏆</div>',stage<2?`<button class="btn primary" id="next">${t('next')} →</button>`:`<button class="btn primary" id="again">↻ ${S.campaign<10?'Nivelul '+(S.campaign+1):t('reset')}</button>`,t('saved'));hud();if(stage<2)$('#next').onclick=()=>{S.stage=stage+1;render()};else $('#again').onclick=()=>{S={...S,campaign:S.campaign<10?S.campaign+1:1,score:S.campaign<10?S.score:0,xp:S.campaign<10?S.xp:0,streak:0,stage:0,unlocked:0,done:[false,false,false]};puzzle=[];gems=[];paths={};render()}}
function emit(stage){const detail={gameId:'tri-link-quest',stage:['puzzle','match','connect'][stage],completed:true,score:S.score,xp:S.xp,timestamp:Date.now()};['arcade:result','mini-game:result','product-loop:result'].forEach(n=>window.dispatchEvent(new CustomEvent(n,{detail})));if(window.parent!==window)window.parent.postMessage({type:'ARCADE_GAME_RESULT',...detail},'*')}
function confetti(){let c=$('#confetti');c.innerHTML=Array.from({length:32},(_,i)=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.4}s">${['◆','●','★'][i%3]}</i>`).join('');setTimeout(()=>c.innerHTML='',1900)}
$('.tabs').onclick=e=>{let b=e.target.closest('.tab');if(!b)return;if(b.disabled){announce(t('locked'));return}S.stage=+b.dataset.stage;render()};$('#difficulty').onclick=()=>{const d=['easy','normal','hard'];S.difficulty=d[(d.indexOf(S.difficulty)+1)%3];gems=[];render()};$('#contrast').onclick=()=>{S.contrast=!S.contrast;hud();persist()};$('#lang').onclick=()=>{S.lang=S.lang==='ro'?'en':'ro';render()};$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';hud();persist()};$('#sound').onclick=()=>{S.sound=!S.sound;hud();persist();if(S.sound)beep()};document.addEventListener('keydown',e=>{if(S.stage!==0)return;let z=puzzle.indexOf(0),map={ArrowLeft:z+1,ArrowRight:z-1,ArrowUp:z+3,ArrowDown:z-3};if(e.key in map){e.preventDefault();movePuzzle(map[e.key])}});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
})();
</script>
